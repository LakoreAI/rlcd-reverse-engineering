# A smaller / faster variant of train.yaml — handy for smoke runs and for
# comparing against the default architecture.

data_root: data/raw
train_file: train.npz
val_file: val.npz
test_file: test.npz
seed: 42

ckpt_dir: checkpoints
result_dir: results
run_name: mlp_small

epochs: 30
batch_size: 256
lr: 0.003
weight_decay: 0.0001
eval_every: 1
ckpt_every: 10

# One narrow hidden layer instead of the default two.
arch: {hidden_dims: [64], embed_dim: 32, dropout: 0.0}

lr_scheduler:
  type: cosine
  t_max: 30
  eta_min: 0.00001
  start_epoch: 0
early_stopping:
  enabled: false
save_best: true
best_metric: accuracy
best_mode: max

wandb:
  enabled: false
