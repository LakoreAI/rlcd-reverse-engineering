# Training config — training-loop hyperparameters only. Model architecture
# (encoder_name, head_layers, ...) lives in src/config.py's
# DecisionModelConfig and can be overridden per-run with the `arch` block
# below. This is the "RL+CE (Laya default)" configuration from
# the project plan's E2 ablation matrix; ≤5h on a single T4 per the
# plan's compute budget (Kaggle free 2xT4).

# --- data ---
dataset_name: LocalLLaMA/typed-decisions
dataset_config: all
# Held out from the train split for raw-ECE validation / temperature
# fitting; never taken from the test split (the project plan).
calib_fraction: 0.1
seed: 42

# --- output ---
ckpt_dir: checkpoints
result_dir: results
run_name: null

# --- optimization ---
epochs: 10
batch_size: 16
accum_steps: 1
num_workers: 2
pin_memory: true
amp: true
lr: 0.00002
weight_decay: 0.01
log_every: 20
eval_every: 1
ckpt_every: 1

# --- RLCD loss (the project plan / sec. 4) ---
# loss = w_rl * L_rl + w_ce * L_ce.
w_rl: 1.0
w_ce: 1.0
num_noise_samples: 4
sigma_start: 1.0
sigma_end: 0.1
anneal_sigma: true
reward_w_spherical: 0.75
reward_w_rps: 1.0

# Architecture overrides applied to DecisionModelConfig.
arch: null
# arch: {encoder_name: convaiinnovations/laya, head_layers: 2}

# --- callbacks ---
lr_scheduler:
  type: cosine
  t_max: auto  # total optimizer steps (the scheduler steps per optimizer step)
  eta_min: 0.0000001
  start_epoch: 0
early_stopping:
  enabled: true
  monitor: raw_ece
  mode: min
  patience: 3
save_best: true
best_metric: raw_ece
best_mode: min

wandb:
  enabled: false
  project: sev
  entity: null
  group: null
  monitor: raw_ece
  mode: min
  log_artifacts: false
