# E4 — reward composition, "log + spherical": identical to
# configs/e2/laya_rlce.yaml except the RPS term is off. See the project plan
# sec. 5, E4.

dataset_name: LocalLLaMA/typed-decisions
dataset_config: all
calib_fraction: 0.1
seed: 42

ckpt_dir: checkpoints
result_dir: results
run_name: e4_log_sph_seed42

epochs: 4
batch_size: 16
accum_steps: 4
num_workers: 4
pin_memory: true
amp: true
amp_dtype: bf16
gradient_checkpointing: false
lr: 0.000025
lr_head: 0.0001
weight_decay: 0.01
grad_clip: 1.0
log_every: 10
eval_every: 1
ckpt_every: 4

w_rl: 1.0
w_ce: 1.0
num_noise_samples: 4
sigma_start: 0.4
sigma_end: 0.1
anneal_sigma: true
reward_w_spherical: 0.75
reward_w_rps: 0.0

arch: {encoder_name: answerdotai/ModernBERT-large, head_layers: 2, max_len: 512, head_max_len: 192}
init_from: convaiinnovations/laya
log_grad_diagnostics: true

lr_scheduler:
  type: cosine
  t_max: auto
  eta_min: 0.000001
early_stopping:
  enabled: false
save_best: false
best_metric: raw_ece
best_mode: min

wandb:
  enabled: true
  project: rlcd-reverse-engineering
  entity: null
  group: e4-reward
  log_artifacts: false
