[project]
name = "rlcd-reverse-engineering"
version = "0.1.0"
description = "Reverse-engineering RLCD: analysis and reproducible experiments on noise-smoothed proper scoring rules for typed probabilistic decisions, using TypeSafe's Jev (public claims) and Laya (open reproduction) as references"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Le Duc Minh", email = "minh.leduc.0210@gmail.com" }]
keywords = [
    "calibration",
    "proper scoring rules",
    "reinforcement learning",
    "typed decisions",
    "non-autoregressive models",
    "evolution strategies",
    "RLCD",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "numpy>=1.26",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.4",
    "sentencepiece>=0.2.2",
    "torch>=2.2",
    "transformers>=5.17.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]
# Pretty training preamble (panels / tables). Falls back to plain text if absent.
rich = ["rich>=13.0"]

[project.urls]
Homepage = "https://github.com/LakoreAI/rlcd-reverse-engineering"
Repository = "https://github.com/LakoreAI/rlcd-reverse-engineering"
Issues = "https://github.com/LakoreAI/rlcd-reverse-engineering/issues"

# Platform-aware torch builds.
#   - Linux + NVIDIA: resolve the CUDA wheel index.
#   - macOS (Apple Silicon): PyTorch ships CPU/MPS arm64 wheels on its own
#     index; the CUDA index has no macOS builds, so darwin resolves CPU.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "pre-commit>=4.0",
    "pytest>=9.1.1",
    "ruff==0.15.15",
]

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint.per-file-ignores]
# scripts/*.py run standalone (not `python -m`), so they need sys.path
# patched with the repo root before their src.* imports resolve.
"scripts/**/*.py" = ["E402"]
